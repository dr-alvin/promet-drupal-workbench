services:
  audit:
    image: promet-d11-visual:1.0.0
    build:
      context: .
    init: true
    user: "${AUDIT_UID:-1000}:${AUDIT_GID:-1000}"
    shm_size: 1gb
    environment:
      AUDIT_REFERENCE_URL: "${AUDIT_REFERENCE_URL:-}"
      AUDIT_TEST_URL: "${AUDIT_TEST_URL:-}"
      AUDIT_SELECT: "${AUDIT_SELECT:-}"
      AUDIT_ASYNC_CAPTURE_LIMIT: "${AUDIT_ASYNC_CAPTURE_LIMIT:-1}"
      AUDIT_ASYNC_COMPARE_LIMIT: "${AUDIT_ASYNC_COMPARE_LIMIT:-4}"
    volumes:
      - "${AUDIT_CONFIG_DIR:?config directory required}:/config:ro"
      - "${AUDIT_OUTPUT:?output required}:/work"
    tmpfs:
      - /tmp:mode=1777
